<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilara & Tayfun | Nişan Davetiyesi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #b76e79;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        }

            margin: 25px 0;
            padding: 15px;
            background: #f9f6f0;
            border-radius: 10px;
        }
        .btn {

            background-color: #b76e79;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #a35d68;
        }
        .map-container {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

</head>
